<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatima Algo Bot v2</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; border: 2px solid #ff4444; border-radius: 15px; padding: 20px; box-shadow: 0 0 20px #ff4444; }
        h1 { color: #ff4444; font-size: 22px; margin-bottom: 20px; }
        select { width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid #444; border-radius: 8px; margin-bottom: 20px; font-size: 16px;}
        .display-area { background: #111; padding: 20px; border-radius: 10px; margin-bottom: 20px; min-height: 120px; border: 1px solid #333;}
        #pair-display { font-size: 18px; color: #ffcc00; margin-bottom: 10px; font-weight: bold;}
        #signal-result { font-size: 32px; font-weight: bold; margin: 10px 0; min-height: 40px;}
        .call { color: #00ff88; text-shadow: 0 0 15px #00ff88; }
        .put { color: #ff4444; text-shadow: 0 0 15px #ff4444; }
        .neutral { color: #888; }
        .btn-grant { width: 100%; padding: 18px; background: linear-gradient(45deg, #ff0044, #ff6600); border: none; color: #fff; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 18px; transition: 0.3s; box-shadow: 0 4px 15px rgba(255,0,68,0.3);}
        .status-bar { font-size: 14px; color: #555; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FATIMA ALGO BOT v2</h1>

        <select id="asset-pair">
            <option value="USDINR_OTC">USD/INR (OTC)</option>
            <option value="USDBDT_OTC">USD/BDT (OTC)</option>
            <option value="EURUSD_OTC">EUR/USD (OTC)</option>
            <option value="USDJPY_OTC">USD/JPY (OTC)</option>
        </select>

        <div class="display-area">
            <div id="pair-display">READY</div>
            <div id="signal-result" class="neutral">---</div>
            <div id="extra-info" style="color:#666;">Click Grant Signal</div>
        </div>

        <button class="btn-grant" onclick="fetchSignal()">GRANT SIGNAL</button>
        <div class="status-bar">System Status: <span style="color: #00ff88;">ONLINE</span></div>
    </div>

<script>
    async function fetchSignal() {
        const pair = document.getElementById('asset-pair').value;
        const resDiv = document.getElementById('signal-result');
        const pairDiv = document.getElementById('pair-display');
        const infoDiv = document.getElementById('extra-info');

        resDiv.innerText = "ANALYZING...";
        resDiv.className = "neutral";

        try {
            // Aapka working link yahan hai
            const url = `https://uzair5099.pythonanywhere.com/get-signal?pair=${pair}`;
            const response = await fetch(url);
            const data = await response.json();

            pairDiv.innerText = data.pair;
            resDiv.innerText = data.direction;
            infoDiv.innerText = "EXPIRY: " + data.time;

            if(data.direction.includes("UP") || data.direction.includes("CALL")) {
                resDiv.className = "call";
            } else if(data.direction.includes("DOWN") || data.direction.includes("PUT")) {
                resDiv.className = "put";
            }
        } catch (e) {
            resDiv.innerText = "ERROR";
            infoDiv.innerText = "Server not responding";
            console.error(e);
        }
    }
</script>
</body>
</html>
