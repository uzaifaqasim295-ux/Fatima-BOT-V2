<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatima Algo Bot v2</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; border: 2px solid #ff4444; border-radius: 15px; padding: 20px; box-shadow: 0 0 20px #ff4444; }
        h1 { color: #ff4444; font-size: 22px; margin-bottom: 20px; }
        select { width: 100%; padding: 12px; background: #222; color: #fff; border: 1px solid #444; border-radius: 8px; margin-bottom: 20px; }
        .display-area { background: #111; padding: 20px; border-radius: 10px; margin-bottom: 20px; min-height: 120px; }
        #pair-display { font-size: 16px; color: #ffcc00; margin-bottom: 10px; }
        #signal-result { font-size: 36px; font-weight: bold; margin: 10px 0; }
        .call { color: #00ff88; text-shadow: 0 0 15px #00ff88; }
        .put { color: #ff4444; text-shadow: 0 0 15px #ff4444; }
        .neutral { color: #888; }
        .btn-grant { width: 100%; padding: 18px; background: linear-gradient(45deg, #ff0044, #ff6600); border: none; color: #fff; font-weight: bold; border-radius: 10px; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn-grant:hover { transform: scale(1.02); }
        .status-bar { font-size: 14px; color: #555; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FATIMA ALGO BOT v2</h1>

        <select id="asset-pair">
            <optgroup label="LIVE MARKET">
                <option value="EURUSD=X">EUR/USD (LIVE)</option>
                <option value="GBPUSD=X">GBP/USD (LIVE)</option>
                <option value="USDJPY=X">USD/JPY (LIVE)</option>
                <option value="AUDUSD=X">AUD/USD (LIVE)</option>
            </optgroup>
            <optgroup label="OTC MARKET">
                <option value="EURUSD_OTC">EUR/USD (OTC)</option>
                <option value="USDINR_OTC">USD/INR (OTC)</option>
                <option value="USDBDT_OTC">USD/BDT (OTC)</option>
                <option value="USDARS_OTC">USD/ARS (OTC)</option>
            </optgroup>
        </select>

        <div class="display-area">
            <div id="pair-display">READY TO START</div>
            <div id="signal-result" class="neutral">---</div>
            <div id="extra-info" style="color:#666;">Select Pair & Click Grant</div>
        </div>

        <button class="btn-grant" onclick="fetchSignal()">GRANT SIGNAL</button>

        <div class="status-bar" id="bot-status">System: Online</div>
        <br>
        <a href="index.html" style="color: #333; text-decoration: none; font-size: 12px;">LOGOUT</a>
    </div>

<script>
    async function fetchSignal() {
        const pair = document.getElementById('asset-pair').value;
        const resDiv = document.getElementById('signal-result');
        const pairDiv = document.getElementById('pair-display');
        const infoDiv = document.getElementById('extra-info');

        resDiv.innerText = "ANALYZING...";
        resDiv.className = "neutral";

        try {
            // AAPKA ONLINE SERVER LINK
           const response = await fetch(https://uzair5099.pythonanywhere.com/get-signal?pair=${pair});
            const data = await response.json();

            pairDiv.innerText = data.pair;
            resDiv.innerText = data.direction;
            infoDiv.innerText = data.time;

            if(data.direction.includes("UP")) resDiv.className = "call";
            else if(data.direction.includes("DOWN")) resDiv.className = "put";
            else resDiv.className = "neutral";

        } catch (e) {
            resDiv.innerText = "ERROR";
            infoDiv.innerText = "Server Connection Failed";
            console.log(e);
        }
    }
</script>
</body>
</html>
